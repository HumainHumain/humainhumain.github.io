<!DOCTYPE html>
<html lang="fr-CA">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" href="../../../styles/hh.core.min.css?###TIMESTAMP###">
		<title>Humain Humain | Erreur</title>
		<style>
			body {
				/* background-color: var(--color-grey); */
				/* color: var(--color-white); */
				background-color: transparent;
				padding: 0;
				display: flex;
				justify-content: center;
				align-items: left;
				/* padding: 0 3rem; */
				/* margin: 0; */
				color: var(--color-grey);
			}

			div {
				padding: 0 20dvw;
				font-weight: 600;
			}

			div::before {
				content: "";
				display: inline-block;
				width: 1rem;
				aspect-ratio: 1 / 1;
				background-image: var(--x-mark);
				transform: translateY(10%);
				margin-right: 0.5rem;
				filter: drop-shadow(0 0 0.1rem var(--color-grey));
			}
			@media screen and (max-width: 767px) {
				body {
					font-size: 1.4rem;
				}

				div::before {
					width: 1.4rem;
				}
			}
		</style>
	</head>
	<body>
		<div>Une erreur est survenue.</div>
	</body>
</html>
