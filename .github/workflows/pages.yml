name: Deploy to GitHub Pages (dist)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Set timezone to Montréal
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "America/Toronto"
          timezoneMacos: "America/Toronto"
          timezoneWindows: "Eastern Standard Time"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # - name: Pull LFS files
      #   run: git lfs pull

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build and Export
        run: node --experimental-wasm-jspi ./node_modules/.bin/kiri export

      - name: Upload artifact (dist)
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
